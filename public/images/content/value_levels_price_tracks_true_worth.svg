<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Market price oscillating in a tight band that closely tracks true worth and never dips below estimated worth</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Time on the horizontal axis and dollars on the vertical axis. A solid line marks true worth, a dashed line below it marks estimated worth, and a dotted line below that marks an acceptable purchase price. A low-amplitude sine curve labelled market price oscillates closely around true worth, staying above the estimated worth line at its lowest. A curly brace on the left spans the gap between the acceptable purchase price and estimated worth, labelled target return.</desc>
