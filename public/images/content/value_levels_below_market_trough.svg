<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Market price oscillating entirely above true worth, estimated worth, and acceptable purchase price</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Time on the horizontal axis and dollars on the vertical axis. A sine curve labelled market price oscillates near the top of the chart. Well below it, a solid line marks true worth, a dashed line marks a lower estimated worth, and a dotted line marks a still-lower acceptable purchase price; all three sit below even the lowest dip of the market price. A curly brace on the left spans the gap between the acceptable purchase price and estimated worth, labelled target return.</desc>
