<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390" viewBox="0 0 680 390" role="img">
<title>Market price versus intrinsic value</title>
<desc>Time on the horizontal axis and dollars on the vertical axis. A solid line marks true worth, a dashed line marks a lower estimated worth, and a dotted line marks a still-lower acceptable purchase price. A sine curve labelled market price oscillates above and below all three levels. A curly brace on the left marks the gap between the acceptable purchase price and estimated worth as the target return.</desc>
<style>text{font-family:'Anthropic Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}</style>
<line x1="66" y1="360" x2="455" y2="360" stroke="#898781" stroke-width="1" stroke-linecap="round"/>
<line x1="66" y1="360" x2="66" y2="52" stroke="#898781" stroke-width="1" stroke-linecap="round"/>
<polygon points="464,360 455,356 455,364" fill="#898781"/>
<polygon points="66,44 61,52 71,52" fill="#898781"/>
<text x="66" y="34" text-anchor="middle" font-size="12" font-weight="400" fill="#52514e">dollars</text>
<text x="472" y="364" text-anchor="start" font-size="12" font-weight="400" fill="#52514e">time</text>
<line x1="66" y1="155" x2="440" y2="155" stroke="#0b0b0b" stroke-width="1.5" stroke-linecap="round"/>
<text x="448" y="159" text-anchor="start" font-size="14" font-weight="500" fill="#0b0b0b">true worth</text>
<line x1="66" y1="208" x2="440" y2="208" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="7 6"/>
<text x="448" y="212" text-anchor="start" font-size="14" font-weight="500" fill="#52514e">estimated worth</text>
<line x1="66" y1="235" x2="440" y2="235" stroke="#52514e" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 6"/>
<text x="448" y="239" text-anchor="start" font-size="14" font-weight="500" fill="#52514e">acceptable purchase price</text>
<path d="M 64 208 Q 58 208 58 212 L 58 217.5 Q 58 221.5 52 221.5 Q 58 221.5 58 225.5 L 58 231 Q 58 235 64 235" fill="none" stroke="#52514e" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="46" y="218" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">target</text>
<text x="46" y="231" text-anchor="end" font-size="12" font-weight="400" fill="#52514e">return</text>
