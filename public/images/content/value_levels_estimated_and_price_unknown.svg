<svg width="100%" viewBox="0 0 680 390" xmlns="http://www.w3.org/2000/svg" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Market price oscillating around a known true worth, with estimated worth and acceptable purchase price marked as unknowns</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Time on the horizontal axis and dollars on the vertical axis. A solid line marks true worth. Estimated worth and acceptable purchase price have no drawn line; each is marked only by a question mark just left of its label, indicating an unknown value. A sine curve labelled market price oscillates above and below true worth. No target-return brace is shown.</desc>
